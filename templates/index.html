
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Result Predictor</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 460px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 { text-align: center; font-size: 25px; }

        .subtitle, .version {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .result {
            margin-top: 22px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        .pass { background: #dcfce7; color: #166534; }
        .fail { background: #fee2e2; color: #991b1b; }

        .error {
            padding: 12px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 7px;
        }

        .version { margin-top: 24px; font-size: 14px; }
    </style>
</head>

<body>
    <main class="container">
        <h1>Student Result Predictor</h1>
        <p class="subtitle">Enter the student's details below.</p>

        <form method="POST">
            <label for="study_hours">Study Hours per Day</label>
            <input
                type="number"
                id="study_hours"
                name="study_hours"
                min="0"
                max="24"
                step="0.1"
                value="{{ study_hours }}"
                required
            >

            <label for="attendance">Attendance Percentage</label>
            <input
                type="number"
                id="attendance"
                name="attendance"
                min="0"
                max="100"
                step="0.1"
                value="{{ attendance }}"
                required
            >

            <label for="internal_mark">Internal Marks (out of 100)</label>
            <input
                type="number"
                id="internal_marks"
                name="internal_marks"
                min="0"
                max="100"
                step="0.1"
                value="{{ internal_marks }}"
                required
            >

            <button type="submit">Predict Result</button>
        </form>

        {% if prediction %}
            <div class="result {{ 'pass' if prediction == 'Pass' else 'fail' }}">
                Predicted Result: {{ prediction }}
            </div>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <p class="version">Model Version: {{ model_version }}</p>
    </main>
</body>
</html>
