version: 0.0
os: linux

files:
  - source: /
    destination: /opt/student-app

file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: scripts/stop_app.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install_app.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 60
      runas: root